{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="card">
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Log in to your BeyondWhole account</p>
    <p class="auth-helper">Use the username you chose during signup.</p>
    <form action="" method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Login" data-loading-text="Signing in...">
    </form>
    <h5>Don't have an account? <a href="{% url 'signup_view' %}">Sign up</a></h5>

</div>
{% endblock %}
