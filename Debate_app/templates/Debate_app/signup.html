{% extends 'base.html' %}
{% block title %}Signup{% endblock %}
{% block content %}

<div class="card">
    <h2>Create your account</h2>
    <p class="auth-subtitle">Start weighing better decisions with both sides.</p>
    <form action="" method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Sign up" data-loading-text="Creating account...">
    </form>
    <h5>Already have an account? <a href="{% url 'login' %}">Log in</a></h5>
    <p class="auth-note">PRIVATE AI DEBATE WORKSPACE</p>
</div>
{% endblock %}
