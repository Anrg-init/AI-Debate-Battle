{% extends 'base.html' %}
{% block title %}Signup - AI Debate Battle{% endblock %}
{% block content %}

<div>
    <br>
</div>
<div class="card">
    <h2>Create Account</h2>
    <form action="" method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Sign up" data-loading-text="Creating account...">
    </form>
    <h5 style="margin-top:12px;">Already have account? <a href="{% url 'login' %}">Login</a></h5>
</div>
{% endblock %}
